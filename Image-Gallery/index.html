<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Image Gallery</h1>

<div class="buttons">

    <button onclick="filterSelection('all')">All</button>

    <button onclick="filterSelection('nature')">Nature</button>

    <button onclick="filterSelection('car')">Cars</button>

    <button onclick="filterSelection('animal')">Animals</button>

</div>

    <div class="gallery">

        <img src="images/img1.jpg" alt="" class="nature">
        <img src="images/img2.jpg" alt="" class="nature">
        <img src="images/img3.jpg" alt="" class="car">
        <img src="images/img4.jpg" alt="" class="car">
        <img src="images/img5.jpg" alt="" class="animal">
        <img src="images/img6.jpg" alt="" class="animal">

    </div>
	
	<!-- Lightbox -->

<div class="lightbox">
    <span class="prev">&#10094;</span>
    <span class="next">&#10095;</span>
    <span class="close">&times;</span>
    <img class="lightbox-img" src="">

</div>


<script src="script.js"></script>

</body>
</html>
