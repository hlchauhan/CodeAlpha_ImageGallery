<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Image Gallery</h1>
    
<div class="buttons">

    <button onclick="filterSelection('all')">All</button>
    <button onclick="filterSelection('human')">Human</button>
    <button onclick="filterSelection('nature')">Nature</button>
    <button onclick="filterSelection('car')">Cars</button>
    <button onclick="filterSelection('animal')">Animals</button>

</div>

    <div class="gallery">

        <img src="images/human1.jpg" alt="" class="human">
        <img src="images/human2.jpg" alt="" class="human">
        <img src="images/human3.jpg" alt="" class="human">
        <img src="images/human4.jpg" alt="" class="human">
        <img src="images/human5.jpg" alt="" class="human">
        <img src="images/human6.jpg" alt="" class="human">
		
		<img src="images/animal1.jpg" alt="" class="animal">
        <img src="images/animal2.jpg" alt="" class="animal">
        <img src="images/animal3.jpg" alt="" class="animal">
        <img src="images/animal4.jpg" alt="" class="animal">
        <img src="images/animal5.jpg" alt="" class="animal">
       
	    <img src="images/nature1.jpg" alt="" class="nature">
        <img src="images/nature2.jpg" alt="" class="nature">
        <img src="images/nature3.jpg" alt="" class="nature">
        <img src="images/nature4.jpg" alt="" class="nature">
        <img src="images/nature5.jpg" alt="" class="nature">
		<img src="images/nature6.jpg" alt="" class="nature">
		
		<img src="images/car1.jpg" alt="" class="car">
        <img src="images/car2.jpg" alt="" class="car">
        <img src="images/car3.jpg" alt="" class="car">
        <img src="images/car4.jpg" alt="" class="car">
        <img src="images/car5.jpg" alt="" class="car">

    </div>
	
	<!-- Lightbox -->

<div class="lightbox">
    <span class="prev">&#10094;</span>
    <span class="next">&#10095;</span>
    <span class="close">&times;</span>
    <img class="lightbox-img" src="">

</div>


<script src="script.js"></script>

</body>
</html>
